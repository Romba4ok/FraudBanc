name: bank-fraud-local

services:
  backend:
    image: bank-fraud-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RISK_LEDGER_SESSION_DIR: /var/lib/risk-ledger/sessions
      RISK_LEDGER_MODEL_REGISTRY_DIR: /var/lib/risk-ledger/model-registry
    volumes:
      - risk-ledger-data:/var/lib/risk-ledger
      - ./backend/artifacts:/app/artifacts
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: "no"

  frontend:
    image: bank-fraud-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: "no"

volumes:
  risk-ledger-data:
